<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Categories - RetailMart Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo">Retail<span>Mart</span> Admin</div>
    <nav style="margin-top:20px;">
      <a href="/admin/dashboard.html" class="admin-nav-item">Dashboard</a>
      <a href="/admin/products.html" class="admin-nav-item">Products</a>
      <a href="/admin/categories.html" class="admin-nav-item active">Categories</a>
      <a href="/admin/orders.html" class="admin-nav-item">Orders</a>
      <a href="/admin/customers.html" class="admin-nav-item">Customers</a>
      <a href="#" onclick="logout()" class="admin-nav-item" style="margin-top:40px; color:#ff9900;">Logout</a>
    </nav>
  </aside>
  
  <main class="admin-main">
    <header class="admin-topbar">
      <h2 style="font-size:20px; font-weight:400;">Manage Categories</h2>
      <button class="btn-primary" onclick="showModal()" style="padding:6px 16px; border-radius:4px;">Add Category</button>
    </header>
    
    <div class="admin-content">
      <table class="admin-table">
        <thead><tr><th>ID</th><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody id="catsTbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="catModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="font-size:18px;">Category Details</h3>
      <button class="modal-close" onclick="hideModal()">×</button>
    </div>
    <form id="catForm">
      <input type="hidden" id="catId">
      <div class="form-group"><label>Name</label><input type="text" id="name" required></div>
      <div class="form-group"><label>Slug (URL-friendly)</label><input type="text" id="slug" required></div>
      <button type="submit" class="btn-primary" style="margin-top:16px; width:100%; border-radius:4px;">Save Category</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin/categories.js"></script>
</body>
</html>
